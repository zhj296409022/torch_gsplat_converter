[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsplat-convert"
version = "0.1.0"
description = "Convert Gaussian Splatting PLY assets to SOG packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
  "plyfile",
]

[project.optional-dependencies]
faiss = ["faiss"]

[project.scripts]
gsplat-convert = "gsplat_convert.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["gsplat_convert*"]